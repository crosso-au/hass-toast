---
# 10. Self-test, then the quick start (first-run)
#
# A script. One toast with a progress bar walks through the checks, then the quick-start toast
# takes its place. The "clear" step is real: hass_toast.clear is what removes the progress
# toast before the quick start appears, so seeing the quick start proves clear works too.
#
# Paste into Settings -> Automations & scenes -> Scripts -> Add script -> (three dots) ->
# Edit in YAML, save, then run it and pick the computer.
alias: HASS Windows Toast - self-test and quick start
fields:
  computer:
    name: Computer
    description: The device id of the computer to test.
    default: my-pc
    selector:
      text:
sequence:
  - action: notify.hass_toast
    data:
      target: "{{ computer }}"
      title: HASS Toast
      message: Checking everything works...
      tag: self-test
      data:
        # About 25 seconds on screen instead of 5, so every step can be watched.
        duration: long
        visual:
          app_logo:
            src: https://raw.githubusercontent.com/crosso-au/hass-toast/main/custom_components/hass_toast/brand/icon.png
            crop: circle
            alt: HASS Toast logo
          progress:
            title: Self-test
            value: 0.25
            value_override: 1 of 4
            status: Testing toast Home Assistant actions (send)
  - repeat:
      for_each:
        - { value: 0.5, step: 2 of 4, status: Testing toast Home Assistant actions (update) }
        - { value: 0.75, step: 3 of 4, status: Testing toast Home Assistant actions (clear) }
        - { value: 1, step: 4 of 4, status: "Testing signed message to COMPUTER" }
      sequence:
        - delay:
            seconds: 2
        - action: hass_toast.update
          data:
            target: "{{ computer }}"
            tag: self-test
            progress:
              title: Self-test
              value: "{{ repeat.item.value }}"
              value_override: "{{ repeat.item.step }}"
              status: "{{ repeat.item.status | replace('COMPUTER', computer) }}"
  - delay:
      seconds: 2
  # The clear test: removes the progress toast from this computer.
  - action: hass_toast.clear
    data:
      target: "{{ computer }}"
  - action: notify.hass_toast
    data:
      target: "{{ computer }}"
      title: Thanks for installing HASS Toast!
      message: If you like it, a star on GitHub helps other Home Assistant users find it.
      tag: welcome-thanks
      attribution: CrossboxLabs
      data:
        scenario: reminder
        visual:
          app_logo:
            src: https://raw.githubusercontent.com/crosso-au/hass-toast/main/custom_components/hass_toast/brand/icon.png
            crop: circle
            alt: HASS Toast logo
        buttons:
          - content: "⭐ Star on GitHub"
            activation: protocol
            uri: https://github.com/crosso-au/hass-toast
          - content: Maybe later
            type: dismiss
  - action: notify.hass_toast
    data:
      target: "{{ computer }}"
      message: HASS Windows Toast is ready on this PC.
      tag: welcome-quick-start
      data:
        scenario: reminder
        header:
          id: hass-toast
          title: HASS Windows Toast
        visual:
          text:
            - "Good {{ 'morning' if now().hour < 12 else 'afternoon' if now().hour < 18 else 'evening' }} - you're all set up."
            - Here's how to send a toast of your own.
          attribution: HASS Windows Toast
          app_logo:
            src: https://raw.githubusercontent.com/crosso-au/hass-toast/main/custom_components/hass_toast/brand/icon.png
            crop: circle
            alt: HASS Windows Toast logo
          hero:
            src: https://raw.githubusercontent.com/crosso-au/hass-toast/refs/heads/main/samples/images/MiniMax_H3_00001_20fps.gif
            alt: CrossboxLabs
          groups:
            - columns:
                - { weight: 1, text_stacking: center, children: [{ text: "1", style: subheaderNumeral, align: center }] }
                - weight: 6
                  text_stacking: center
                  children:
                    - { text: "Open Developer tools, then Actions", style: base }
                    - { text: in Home Assistant, style: captionSubtle }
            - columns:
                - { weight: 1, text_stacking: center, children: [{ text: "2", style: subheaderNumeral, align: center }] }
                - weight: 6
                  text_stacking: center
                  children:
                    - { text: Paste in any sample, style: base }
                    - { text: from the samples folder on GitHub, style: captionSubtle }
            - columns:
                - { weight: 1, text_stacking: center, children: [{ text: "3", style: subheaderNumeral, align: center }] }
                - weight: 6
                  text_stacking: center
                  children:
                    - { text: Watch it pop up right here, style: base }
                    - { text: then make it your own, style: captionSubtle }
        buttons:
          - content: Open samples
            activation: protocol
            uri: https://github.com/crosso-au/hass-toast/tree/main/samples
            style: Success
          - type: dismiss

